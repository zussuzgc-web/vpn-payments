name = "vpn-payments-notify"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# KV-хранилище для статусов заказов
[[kv_namespaces]]
binding = "ORDERS"
id = "ЗАМЕНИТЬ_НА_ТВОЙ_KV_ID"

# Секреты задаются командами (см. README.md), НЕ хранятся в файле:
#   wrangler secret put MERCHANT_ID
#   wrangler secret put SECRET_KEY
#   wrangler secret put BOT_TOKEN
#   wrangler secret put API_SECRET

[observability]
enabled = true
